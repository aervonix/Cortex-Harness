# The compiler the fuzz targets are built with. The fuzzer needs a nightly
# one; it is pinned to a date so that a new nightly cannot break the nightly
# workflow's `fuzz` job without a change here.
#
# This is the one place the date is written. `cargo xtask fuzz` and the
# workflow run inside this directory, where this file decides the toolchain.
# How to move it forward is in docs/testing-and-ci.md, "Not blocking".
[toolchain]
channel = "nightly-2026-11-13"
profile = "minimal"
