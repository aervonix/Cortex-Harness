[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/aervonix/Cortex-Harness"

# One table, so each crate has one version and one feature set.
# Every third-party entry also needs a row in docs/dependencies.md
# (`cargo xtask rules` fails when the two disagree).
[workspace.dependencies]
# Workspace crates. Which crate may depend on which is fixed by
# docs/architecture/01-workspace.md and checked by `cargo xtask rules`.
cortex-agent = { path = "crates/cortex-agent" }
cortex-base = { path = "crates/cortex-base" }
cortex-config = { path = "crates/cortex-config" }
cortex-core = { path = "crates/cortex-core" }
cortex-ext = { path = "crates/cortex-ext" }
cortex-index = { path = "crates/cortex-index" }
cortex-knowledge = { path = "crates/cortex-knowledge" }
# Default features are off here so that a crate has to ask for the HTTP stack.
cortex-llm = { path = "crates/cortex-llm", default-features = false }
cortex-mcp = { path = "crates/cortex-mcp" }
cortex-policy = { path = "crates/cortex-policy" }
cortex-protocol = { path = "crates/cortex-protocol" }
cortex-rpc = { path = "crates/cortex-rpc" }
cortex-sandbox = { path = "crates/cortex-sandbox" }
cortex-session = { path = "crates/cortex-session" }
cortex-stats = { path = "crates/cortex-stats" }
cortex-term = { path = "crates/cortex-term" }
cortex-testkit = { path = "crates/cortex-testkit" }
cortex-tools = { path = "crates/cortex-tools" }
cortex-tui = { path = "crates/cortex-tui" }

# Third-party crates. Default features off; opt in to what is used.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-width = { version = "0.2.3", default-features = false }

# The nightly unused-dependency check (`cargo xtask unused`, cargo-machete)
# looks at third-party crates only, for now. The skeleton declares the edges
# between workspace crates that docs/architecture/01-workspace.md gives each
# crate, before the code that uses them exists, so every one of them would be
# reported. Which crate may depend on which is checked by `cargo xtask rules`.
# Remove a name from this list when the crates that depend on it have code,
# and the whole table once the first release's crates are built.
[workspace.metadata.cargo-machete]
ignored = [
    "cortex-agent",
    "cortex-base",
    "cortex-config",
    "cortex-core",
    "cortex-ext",
    "cortex-index",
    "cortex-knowledge",
    "cortex-llm",
    "cortex-mcp",
    "cortex-policy",
    "cortex-protocol",
    "cortex-rpc",
    "cortex-sandbox",
    "cortex-session",
    "cortex-stats",
    "cortex-term",
    "cortex-testkit",
    "cortex-tools",
    "cortex-tui",
]

[workspace.lints.rust]
# Allowed per module in cortex-sandbox and cortex-term only, where the OS
# interfaces need it, with a safety comment on each block.
unsafe_code = "deny"
# Public items are documented: part of "done" for every step.
missing_docs = "warn"
missing_debug_implementations = "warn"
# `pub` that cannot be reached from outside the crate should say `pub(crate)`.
unreachable_pub = "warn"

[workspace.lints.clippy]
# The project rules from docs/testing-and-ci.md. The lists they use are in
# clippy.toml. CI turns every warning into an error.
#
# Blocking standard-library calls must not run on the core thread.
disallowed_methods = "warn"
disallowed_types = "warn"
# No unwrap or expect outside tests, unless an attribute gives the invariant:
#   #[expect(clippy::unwrap_used, reason = "the regex is a literal")]
unwrap_used = "warn"
expect_used = "warn"
# Nothing writes to standard output or standard error by accident.
# cortex-cli and xtask are the two crates that allow these.
print_stdout = "warn"
print_stderr = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# An exception to a lint always carries its reason.
allow_attributes_without_reason = "warn"
# Nothing unfinished reaches the main branch.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Exiting the process skips terminal restoration. Return an exit code instead.
exit = "warn"

# The profiles are decision 0012 (docs/decisions/0012-release-profile.md).
# `panic = "unwind"` is Cargo's default and is what every profile uses:
# a panic in a tool task or an extension call is caught at the task boundary.
[profile.dev]
debug = "line-tables-only"

# Third-party crates: lightly optimised, no debug info.
[profile.dev.package."*"]
opt-level = 1
debug = false

# What the blocking CI test jobs and `cargo xtask ci` build with: `dev`, with
# third-party crates unoptimised. Optimising them is worth it at a desk, where
# they are built once and kept. On a hosted runner with a cold cache it is the
# difference between fitting in 5 minutes and not: a clean build of the
# planned dependency set took 129 s on Linux and 259 s on Windows with
# opt-level 1, and 27 to 45 s and 60 to 82 s with opt-level 0
# (docs/testing-and-ci.md). Our own crates keep their line tables, so a
# failing test's backtrace has line numbers; that measured as free to 8%.
[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
opt-level = 0
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

# Published binaries: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
