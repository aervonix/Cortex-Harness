# Venice.ai
# ---------
#
# Read on 2026-11-13 from api.venice.ai/api/v1/models (its public model
# list: ids, limits, prices, reasoning levels) and docs.venice.ai
# (overview/pricing, api-reference/rate-limiting).
#
# - **A speed is another model.** Venice.ai has no `service_tier`. It lists
#   a faster variant of some models as a model of its own, at its own
#   price: `deepseek-v4-flash-0731-fast` beside `deepseek-v4-flash-0731`.
#   The flag `speed_model_fast` names that id, and a request at `fast` is
#   sent to it. Its rate limits are per model and per key, so the fast
#   variant has limits of its own. What happens when it has no capacity is
#   an error (429 `MODEL_OVERLOADED`, or 503 `MODEL_AT_CAPACITY`): nothing
#   says it is served by the standard model. Whether the two share a cache
#   is not stated.
# - **The fast variant's output limit is smaller:** 32,768 tokens, where
#   the standard model's is 262,144. An entry has one output limit, so the
#   flag `speed_max_output_fast` gives the variant's, and a request at
#   `fast` is held to it.

[[model]]
provider = "venice"
id = "deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash 0731 (Venice.ai)"
protocol = "openai-chat"
context_window = 1_000_000
max_output = 262_144
input = ["text"]
source = "api.venice.ai/api/v1/models, docs.venice.ai/overview/pricing, api-reference/rate-limiting; read 2026-11-13"

[model.prices]
input = 0.13
output = 0.26
cache_read = 0.028

[model.reasoning]
levels = ["none", "low", "high", "max"]
default = "high"

[model.capabilities]
structured_output = true

[model.flags]
