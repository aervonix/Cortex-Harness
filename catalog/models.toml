name = "DeepSeek Flash"
protocol = "openai-chat"
context_window = 1_000_000
max_output = 393_216
input = ["text", "image"]
source = "api-docs.deepseek.com/quick_start/pricing, api/create-chat-completion, guides/thinking_mode; read 2026-11-13; peak prices"

[model.prices]
