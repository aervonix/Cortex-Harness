# The servers that speak openai-chat
# ----------------------------------
#
# Added on 2026-11-13 (step 31). Each entry's `source` says where its facts
# were read. Three things hold for all of them:
#
# - **These are the models the protocol's fixtures were recorded from,** and
#   one entry for OpenAI itself. It is not a list of what each server
#   offers: OpenRouter and Venice.ai each serve hundreds of models, and a
#   user adds the ones they use (docs/architecture/04-providers.md, "Model
#   catalog").
# - **An aggregator's price is the price of one route.** OpenRouter sends a
#   request to whichever upstream provider it chooses, and the price is that
#   provider's. The prices here are the ones its model list gives for the
#   model. Its responses state the cost of each request, and that figure
#   overrides the calculation from these prices.
# - **A local server has no entry.** What a user runs on their own machine
#   is theirs to describe.
#
# OpenAI
# ------
#
# Read on 2026-11-13 from developers.openai.com/api/docs:
#   models/gpt-6-luna              (limits, prices, reasoning levels,
#                                   endpoints, service tiers)
#   pricing                        (every tier's rate card, the long-context
#                                   rule)
#   guides/fast-mode               (the fast tier: how it is asked for, what
#                                   the response says, the downgrade)
#   guides/flex-processing         (the flex tier, and its refusal)
#   guides/prompt-caching          (cache writes and their two lifetimes)
#
# Not checked against the real API: there was no key.
#
# - **On Chat Completions this model takes tools only at the reasoning
#   level `none`.** Its page says so ("Chat Completions supports function
#   calling only when reasoning_effort is none"). The flag `tools_reasoning`
#   makes the protocol send that level whenever tools are sent, and refuse
#   a request that names another. OpenAI's newer models (GPT-6.1 Terra's
#   page: "tool calling requires the Responses API") have no entry here at
#   all: they wait for the `openai-responses` protocol.
# - **The fast tier** (`service_tier: "priority"`, which the API also takes
#   as `"fast"`): "up to 2.5x faster speeds", twice the standard price,
#   the same rate limit as standard, and when traffic ramps too fast "the
#   system may downgrade some Fast mode requests to standard speeds and
#   charge standard rates", which the response shows as
#   `service_tier: "default"`. Whether it shares the prompt cache with
#   standard is not stated.
# - **The flex tier** (`service_tier: "flex"`): batch prices, slower, and a
#   429 "Resource Unavailable", not charged, when there is no capacity.
# - **The cache-write classes** are the two lifetimes the pricing page
#   lists, the default first.

[[model]]
provider = "openai"
id = "gpt-6-luna"
name = "GPT-6 Luna"
protocol = "openai-chat"
context_window = 1_050_000
max_output = 128_000
input = ["text", "image"]
source = "developers.openai.com/api/docs/models/gpt-6-luna, pricing, guides/fast-mode, guides/flex-processing; read 2026-11-13; documentation only"

[model.prices]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = [{ class = "30m", price = 0.125 }, { class = "12h", price = 0.25 }]
above = [{ input_tokens = 272_000, input = 0.20, output = 0.75, cache_read = 0.02, cache_write = [{ class = "30m", price = 0.25 }, { class = "12h", price = 0.50 }] }]

[model.reasoning]
levels = ["none", "low", "medium", "high", "xhigh", "max"]
default = "medium"

[model.capabilities]
strict_tools = true
structured_output = true
min_cacheable_tokens = 1024

[model.flags]
tools_reasoning = "none"

[[model.speed]]
name = "fast"
label = "Fast mode"
effect = "faster_output"
when_unavailable = "downgrade"
separate_limit = false

[model.speed.prices]
input = 0.20
output = 1.00
cache_read = 0.02
cache_write = [{ class = "30m", price = 0.25 }, { class = "12h", price = 0.50 }]
above = [{ input_tokens = 272_000, input = 0.40, output = 1.50, cache_read = 0.04, cache_write = [{ class = "30m", price = 0.50 }, { class = "12h", price = 1.00 }] }]

[[model.speed]]
name = "flex"
label = "Flex processing"
effect = "deferred"
when_unavailable = "error"
separate_limit = false

[model.speed.prices]
input = 0.05
output = 0.25
cache_read = 0.005
cache_write = [{ class = "30m", price = 0.0625 }, { class = "12h", price = 0.125 }]

# OpenRouter
# ----------
#
# Read on 2026-11-13 from openrouter.ai:
#   api/v1/models                  (its public model list: ids, limits,
#                                   prices, reasoning levels, input)
#   api/v1/models/<id>/endpoints   (the endpoints of a model, among them
#                                   the ones of each service tier, with
#                                   their prices)
#   docs/guides/features/service-tiers
#   docs/guides/best-practices/reasoning-tokens, prompt-caching
#
# - **Service tiers.** `service_tier` in the request, and the tier that
#   served it at the top level of the response. A `priority` request that
#   no priority endpoint can take "falls back to default endpoints, billed
#   at the standard rate"; a `flex` request with no endpoint at or below
#   the flex price gets a capacity error.
# - **Reasoning levels** are the ones the model list gives for each model.
#   A model marked `mandatory` there cannot have its reasoning turned off,
#   so its levels have no `none`.
# - **Claude through OpenRouter** caches only where a request marks it,
#   with Anthropic's own markers: the flag `cache_control`.

