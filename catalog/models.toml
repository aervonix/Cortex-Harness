# DeepSeek
# --------
#
# Read on 2026-11-13 from api-docs.deepseek.com:
#   quick_start/pricing            (ids, limits, prices, features)
#   api/create-chat-completion     (reasoning levels, the output limit)
#   guides/thinking_mode           (reasoning, and sending it back)
#   guides/kv_cache                (the cache, which is automatic)
#
# - **The prices are the peak prices.** The pricing page gives two rate
#   cards: off-peak is half of peak, and peak is 01:00 to 04:00 and 06:00 to
#   10:00 UTC on weekdays. This file has one rate card for a speed, so the
#   dearer one is entered, and a request made off-peak costs half of what
#   is recorded for it. A price that depends on the time of day is the case
#   docs/decisions/0027-speed-tiers.md lists under "Revisit when".
# - **Limits.** The page says "1M" for the context and "384K" for the
#   output; the API reference gives the output limit as 393,216.
# - **Reasoning** is on by default, at `high`. The API takes `none`, `low`,
#   `high` and `max`, and maps other names onto these.
# - **No speed tier.**

[[model]]
provider = "deepseek"
