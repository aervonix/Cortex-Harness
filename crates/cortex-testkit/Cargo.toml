[package]
name = "cortex-testkit"
description = "Test support: the scripted provider, the scripted SSE server, the virtual terminal, the pseudo-terminal driver, temporary workspaces and the fake clock. A dev-dependency only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
# The types and traits only. A test of the real HTTP transport turns the
# `http` feature on in the crate that owns it.
cortex-llm.workspace = true
cortex-term.workspace = true
serde_json.workspace = true

[lints]
workspace = true
