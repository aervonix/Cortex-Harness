[package]
name = "cortex-core"
description = "Wires every part into a Core that accepts operations and emits events. The only crate that knows all the parts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["mcp", "sandbox"]
# Links the MCP client.
mcp = ["dep:cortex-mcp"]
# Links the OS sandbox's backends (Landlock and seccomp on Linux). Without it
# every session reports the sandbox off, and `autonomous` is refused.
sandbox = ["cortex-sandbox/backends"]

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
cortex-llm = { workspace = true, features = ["http"] }
cortex-tools.workspace = true
cortex-sandbox.workspace = true
cortex-policy.workspace = true
cortex-session.workspace = true
cortex-config.workspace = true
cortex-stats.workspace = true
cortex-knowledge.workspace = true
cortex-index.workspace = true
cortex-agent.workspace = true
cortex-ext.workspace = true
cortex-mcp = { workspace = true, optional = true }

serde_json.workspace = true
toml = { workspace = true, features = ["display"] }
tracing.workspace = true
# The runtime the core's tasks run on: `rt` for tasks and the blocking pool,
# `sync` for the wake-ups of a client's queue. The timer is not asked of
# it here: every wait is on `cortex_base::Timer`.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
cortex-testkit.workspace = true
# The seam that puts the loop's blocking work on the test's own thread, in
# a seeded order (`docs/testing-and-ci.md`, "A seeded order of events").
cortex-tools = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
