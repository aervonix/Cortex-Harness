[package]
name = "cortex-core"
description = "Wires every part into a Core that accepts operations and emits events. The only crate that knows all the parts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["mcp"]
# Links the MCP client.
mcp = ["dep:cortex-mcp"]

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
cortex-llm = { workspace = true, features = ["http"] }
cortex-tools.workspace = true
cortex-sandbox.workspace = true
cortex-policy.workspace = true
cortex-session.workspace = true
cortex-config.workspace = true
cortex-stats.workspace = true
cortex-knowledge.workspace = true
cortex-index.workspace = true
cortex-agent.workspace = true
cortex-ext.workspace = true
cortex-mcp = { workspace = true, optional = true }

[lints]
workspace = true
