[package]
name = "cortex-cli"
description = "The cortex binary, also installed under the alias cx: argument parsing, mode selection and the headless printer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One executable. `cx` is a link to it, never a second build target
# (docs/decisions/0013-naming.md).
[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-base.workspace = true
cortex-config.workspace = true
cortex-core.workspace = true
cortex-protocol.workspace = true
# The body of the hidden guard subcommand (`tree::run_guard`).
cortex-sandbox.workspace = true
cortex-rpc.workspace = true
cortex-tui.workspace = true

lexopt.workspace = true
serde_json.workspace = true
# The core thread's runtime (`rt`, with `time` for the provider layer's and
# the process runner's timers), the channels between the binary's threads
# (`sync`), and Ctrl-C, SIGTERM and the console's events (`signal`).
tokio = { workspace = true, features = ["rt", "sync", "time", "signal"] }
# Installs the log's subscriber as the process's own.
tracing.workspace = true

[dev-dependencies]
cortex-testkit.workspace = true

[lints]
workspace = true
