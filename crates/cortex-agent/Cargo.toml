[package]
name = "cortex-agent"
description = "The agent loop: the turn state machine, the tool scheduler, the steering queue, verification, context assembly and compaction."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
cortex-protocol.workspace = true
cortex-base.workspace = true
# The types and traits only: the loop never names a transport.
cortex-llm.workspace = true
cortex-tools.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `rt` for tasks (a tool call, a plan, a question each run as one), `sync`
# for the channel they report on and for waking an idle session.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
cortex-testkit.workspace = true

[lints]
workspace = true
