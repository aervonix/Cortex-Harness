# Tells people that a non-blocking workflow failed.
#
# The `main` and `nightly` workflows do not block a merge, so nobody is
# looking at them when they fail. This opens an issue for the workflow, or
# adds a comment to the one that is already open, so that a failure is never
# silent and repeated failures do not pile up as separate issues. A person
# closes the issue when the cause is fixed; the next failure opens a new one.
#
# The job that uses this needs `issues: write`, and is the only job that has
# it (`cargo xtask rules` checks that). It must check the repository out
# first, because this action is a file in it.
name: Report failure
description: Opens an issue for a failed non-blocking workflow, or comments on the open one.

inputs:
  workflow:
    description: The workflow's name, as in its `name:` line.
    required: true
  needs:
    description: "The `needs` context of the reporting job, as JSON: `toJSON(needs)`."
    required: true
  token:
    description: A token that can write issues.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        WORKFLOW: ${{ inputs.workflow }}
        NEEDS: ${{ inputs.needs }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        label="ci-failure"
        title="The ${WORKFLOW} workflow failed"

        failed=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "`\(.key)` (\(.value.result))"] | join(", ")' <<< "$NEEDS")
        body=$(printf '%s\n' \
          "The non-blocking \`${WORKFLOW}\` workflow failed." \
          "" \
          "| | |" \
          "|---|---|" \
          "| Run | ${RUN_URL} (attempt ${RUN_ATTEMPT}) |" \
          "| Jobs that did not succeed | ${failed:-unknown} |" \
          "| Trigger | \`${EVENT}\` on \`${REF}\` |" \
          "| Commit | ${SHA} |" \
          "" \
          "This workflow does not block merging, which is why it reports here instead. What it checks and why is in \`docs/testing-and-ci.md\`, under \"Not blocking\". Close this issue when the cause is fixed. Until then, later failures are added below as comments.")

        # The label makes these issues easy to find. Creating it again is harmless.
        gh label create "$label" --color B60205 \
          --description "A non-blocking workflow failed" 2>/dev/null || true

        # The list endpoint, not search: search lags behind by seconds to
        # minutes, and two failures close together would open two issues.
        number=$(gh issue list --state open --label "$label" --limit 100 --json number,title \
          | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')

        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$body"
          echo "Added a comment to issue #${number}."
        else
          gh issue create --title "$title" --label "$label" --body "$body"
        fi
