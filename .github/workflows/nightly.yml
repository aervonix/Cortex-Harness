# Every night: the checks that do not belong on a pull request. So far, the
# advisory check, the unused-dependency check, a release build for every
# release target, the property tests with many more cases than a pull
# request runs, the mutation driver's test against the real cargo,
# coverage-guided fuzzing of the stream decoders, and the sandbox's tests on
# a kernel with the partial Landlock (ABI 4). Later
# steps add the long-session memory test and the live smoke tests (tiers 5
# and 6).
#
# It does not block anything. When it fails, the `report` job opens an issue,
# or adds a comment to the one that is open. The layout and the reasons are
# in docs/testing-and-ci.md, "Not blocking". `cargo xtask rules` checks this
# file: actions pinned by commit hash, a read-only token, and `issues: write`
# for the `report` job alone.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: Fail on purpose, to test that a failure opens an issue.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # Dependency hygiene. Advisories are here and not on pull requests because
  # a new advisory against an unchanged lockfile must not block unrelated
  # work. Both checks run even when the first fails.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail on purpose
        if: ${{ inputs.force_failure }}
        run: |
          echo "::error::Failing on purpose: this run was started with force_failure."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Advisories
        run: cargo run --locked --quiet --package xtask -- advisories
      - name: Unused dependencies
        if: ${{ !cancelled() && !inputs.force_failure }}
        run: cargo run --locked --quiet --package xtask -- unused

  # The published profile (`dist`), built for every release target (the
  # owner's decision 14 in docs/build-plan.md: Linux x86-64 and arm64,
  # static, and Windows x86-64), each on a runner of its own architecture.
  # No build cache: nobody waits for this run.
  release:
    name: release-${{ matrix.name }}
    if: ${{ !inputs.force_failure }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # The TLS library has C code (ring), and a static Linux build compiles
      # it with the musl C compiler, which the runner image does not carry.
      - name: Install the C compiler for the static target (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Release build, binary size and crate count
        run: cargo run --locked --quiet --package xtask -- size --check --target ${{ matrix.target }}
      # The timeout report on Windows, where it asks PowerShell for the
      # process tree. Plain `cargo test`: this job has no nextest, and the
      # test gives its child the variables nextest would.
      - name: The timeout report and the race pause (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked -p cortex-testkit --lib -- --ignored watch::tests::sys_
      # combine on Windows, where git makes its object files read-only and
      # the clone has to be made writable to be removed.
      - name: combine, against real git (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked -p xtask -- --ignored combine::tests::sys_
      - name: Keep the record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-${{ matrix.target }}
          path: target/size/*.json
          if-no-files-found: ignore
          retention-days: 30

  # The property tests of tiers 1 and 2, with fifty times the cases a pull
  # request checks (docs/testing-and-ci.md, "Property tests"). A failure
  # prints the seed of the failing case, which runs it alone at a desk. On
  # Linux only: the properties are of pure logic, the Windows path rules are
  # among them on every OS, and the workflow keeps to one Windows job. It
  # runs in nextest's `properties` profile, whose limits on one test are
  # scaled for fifty times the cases (.config/nextest.toml).
  properties:
    if: ${{ !inputs.force_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORTEX_PROPERTY_SCALE: "50"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: Tiers 1 and 2, with more property cases
        run: cargo run --locked --quiet --package xtask -- test --locked --profile properties
      # `cargo xtask mutate` against the real cargo and nextest, on the small
      # workspace kept for it (docs/testing-and-ci.md, "Breaking the code on
      # purpose"). It builds that workspace about ten times over, which is
      # why it is here and not in the blocking checks.
      - name: The mutation driver, against the real cargo
        run: cargo run --locked --quiet --package xtask -- test --locked -p xtask --run-ignored only sys_the_real
      # The report a test writes when it runs out of time, against a test
      # that hangs on purpose, and the pause that widens the scripted
      # server's races (docs/testing-and-ci.md, "When a test runs out of
      # time"). Ignored in the blocking checks, because they wait on
      # purpose; the Windows release job runs them too.
      - name: The timeout report and the race pause
        run: cargo run --locked --quiet --package xtask -- test --locked -p cortex-testkit --run-ignored only watch::tests::sys_

  # Coverage-guided fuzzing of the stream decoders (docs/testing-and-ci.md,
  # "Not blocking"): the parser of server-sent events and the decoder of
  # each provider protocol, each for a fixed time, starting from the recorded
  # fixtures. The fuzzer needs a nightly compiler, which only this job
  # installs; the targets are a package of their own, `fuzz/`, outside the
  # workspace. The nightly is pinned to a date in `fuzz/rust-toolchain.toml`,
  # so that a new nightly cannot break this job by itself. An input that
  # fails is kept as an artifact of the run.
  fuzz:
    if: ${{ !inputs.force_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml, and the fuzzer's from fuzz/rust-toolchain.toml
        run: |
          rustup toolchain install
          cd fuzz
          rustup toolchain install
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz the stream decoders
        run: cargo run --locked --quiet --package xtask -- fuzz --seconds 120
      - name: Keep the inputs that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # The sandbox's confinement tests on Ubuntu 22.04, whose kernel has
  # Landlock ABI 4: the partial case, which enforces with the signal gap
  # named and which no other runner or machine of ours has
  # (docs/testing-and-ci.md, "Not blocking"). The tests fail rather than
  # skip on CI when Landlock is missing, and the command fails when the run
  # did not show the partial case, so an image whose kernel moves on cannot
  # turn this job into a second copy of the blocking one. No cache: the
  # cache's key names the OS and not its version.
  partial-landlock:
    if: ${{ !inputs.force_failure }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: The sandbox's tests, with Landlock ABI 4
        run: cargo run --locked --quiet --package xtask -- partial-landlock

  # The only job with a token that can write, and all it can write is issues.
  #
  # Only for a run on the main branch, scheduled or dispatched there: a
  # session's own nightly run on its branch must not add to the main
  # branch's issue.
  #
  # `partial-landlock` is not among the jobs it reports, for now: on Ubuntu
  # 22.04 `cortex-sandbox protect::tests::a_change_that_puts_the_modification_time_back_is_still_found`
  # fails (the watch does not see a change whose modification time is put
  # back), and the fixes to step 26 will make it pass and put the job back
  # here. Until then the job's failure shows on its run and opens no issue.
  report:
    needs: [dependencies, release, properties, fuzz]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-failure
        with:
          workflow: nightly
          needs: ${{ toJSON(needs) }}
          token: ${{ github.token }}
