# A run on the hosted runners for a branch that has no pull request yet.
#
# It runs one `cargo xtask` command on Linux, Windows or both, for any branch
# that has been pushed, and blocks nothing:
#
#   gh workflow run try --ref <branch> -f command=startup -f profile=dist
#   gh workflow run try --ref <branch> -f os=windows -f command="test -p cortex-tools shell::"
#   gh workflow run try --ref <branch> -f command="stress -p cortex-testkit" -f count=200 -f load=6 -f cores=2
#   gh workflow run try --ref <branch> -f command="test -p cortex-agent" -f filter="test(/denials/); test(=x)"
#   gh workflow run try --ref <branch> -f os=windows -f command=test -f against=main -f count=5
#   gh workflow run try --ref <branch> -f os=linux-22.04 -f command="test -p cortex-sandbox"
#   gh workflow run try --ref <branch> -f os=linux-22.04 -f command=partial-landlock
#   gh workflow run try --ref <branch> -f os=linux -f command=ci
#   ci-wait --workflow try                    (from the branch, for its head commit)
#
# The inputs reach `cargo xtask try` as arguments, through the environment,
# and never as text in a script. `try` checks them and chooses the command:
# docs/testing-and-ci.md, "A run on the runners without a pull request", has
# the rules. The output is printed in the run's summary, and the JUnit
# reports and the log are kept as artifacts. `cargo xtask rules` checks this
# file as it does the others: actions pinned by commit hash, a read-only
# token, and no input in a script.
name: try

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Where to run it."
        type: choice
        options: [both, linux, windows, linux-22.04]
        default: both
      command:
        description: "test [-p CRATE] [FILTER], stress -p CRATE [ARGS], startup, perf [ARGS], ci [ARGS], or a nightly job: partial-landlock, advisories, unused."
        required: true
        default: "test"
      profile:
        description: "The cargo profile: ci (the blocking jobs' build), release or dist. startup needs release or dist."
        type: choice
        options: [ci, release, dist]
        default: ci
      count:
        description: "Repeats: a stress run's count (test becomes stress), or startup's runs. Empty: the command's own."
        required: false
        default: ""
      load:
        description: "Busy loops beside a stress run. Empty: none."
        required: false
        default: ""
      cores:
        description: "Pin a stress run to this many cores. Empty: every core."
        required: false
        default: ""
      filter:
        description: "nextest filter expressions for test or stress, separated by ;. Empty: none."
        required: false
        default: ""
      against:
        description: "A ref to compare the branch with, both run in turn on one runner (count rounds). Empty: no comparison."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # The job's id and its environment are those of the blocking test job, on
  # purpose: the build cache's key is made of them, so a run in the `ci`
  # profile restores the cache the main branch wrote for `test-linux` or
  # `test-windows` and builds only what the branch changed. It never writes
  # a cache. A release or dist build has no cache, and builds from scratch.
  test:
    name: try-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Not a blocking check: a dist build from scratch takes most of this on
    # Windows.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # linux-22.04: Landlock ABI 4, the partial case no other runner has.
        include: ${{ fromJSON(inputs.os == 'linux' && '[{"name":"linux","os":"ubuntu-latest"}]' || inputs.os == 'windows' && '[{"name":"windows","os":"windows-latest"}]' || inputs.os == 'linux-22.04' && '[{"name":"linux-22.04","os":"ubuntu-22.04"}]' || '[{"name":"linux","os":"ubuntu-latest"},{"name":"windows","os":"windows-latest"}]') }}
    steps:
      # No token is kept in the checkout: what an A/B run builds may be any
      # ref's code, and nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep cargo's and rustup's files off the system disk (Windows)
        if: runner.os == 'Windows'
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP\rustup" >> $env:GITHUB_ENV
          # Temporary files too, as in the blocking test job.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tmp" | Out-Null
          "TEMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP\tmp" >> $env:GITHUB_ENV
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Not on 22.04: the cache's key names the OS and not its version, and
      # build scripts built on the newer image do not run on the older one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.name != 'linux-22.04'
        with:
          save-if: "false"
          cache-bin: "false"
      # An A/B run's other tree, built in a directory of its own (`cargo
      # xtask ab`). The checkout can only be made inside the workspace, so it
      # is moved beside it: inside, the branch's .cargo/config.toml would
      # apply to its build too.
      - name: Check out the ref to compare with
        if: inputs.against != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.against }}
          path: ab-base
          persist-credentials: false
      - name: Put it beside the branch's checkout
        if: inputs.against != ''
        shell: bash
        run: mv ab-base ../ab-base
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # `ci` runs `check`, whose steps include actionlint and cargo-deny, and the nightly's
      # `advisories` is cargo-deny too; its `unused` is cargo-machete. Both
      # are prebuilt binaries the action checks against its checksums, at
      # the versions the other workflows pin. The condition reads the
      # command's first word with spaces around it, so `test -p x-ci` does
      # not match; `cargo xtask try` decides what runs.
      - name: Install cargo-deny and actionlint
        if: contains(format(' {0} ', inputs.command), ' ci ') || contains(format(' {0} ', inputs.command), ' advisories ')
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,actionlint@1
      - name: Install cargo-machete
        if: contains(format(' {0} ', inputs.command), ' unused ')
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      # The log is kept in the runner's temporary folder, and nothing is made
      # under `target` before cargo makes it. On Windows the command runs in
      # PowerShell, as the blocking test job's does: run from Git Bash, with
      # `target/try` made first by its `mkdir`, Windows tests of a file held
      # with no sharing failed there that pass in the blocking job
      # (docs/steps/tooling-3/ci.md).
      - name: Run (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TRY_COMMAND: ${{ inputs.command }}
          TRY_PROFILE: ${{ inputs.profile }}
          TRY_COUNT: ${{ inputs.count }}
          TRY_LOAD: ${{ inputs.load }}
          TRY_CORES: ${{ inputs.cores }}
          TRY_FILTER: ${{ inputs.filter }}
          TRY_AGAINST: ${{ inputs.against }}
        run: |
          set -o pipefail
          cargo run --locked --quiet --package xtask -- try \
            --command "$TRY_COMMAND" --profile "$TRY_PROFILE" \
            --count "$TRY_COUNT" --load "$TRY_LOAD" --cores "$TRY_CORES" \
            --filter "$TRY_FILTER" --against "$TRY_AGAINST" \
            2>&1 | tee "$RUNNER_TEMP/try-output.log"
      - name: Run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRY_COMMAND: ${{ inputs.command }}
          TRY_PROFILE: ${{ inputs.profile }}
          TRY_COUNT: ${{ inputs.count }}
          TRY_LOAD: ${{ inputs.load }}
          TRY_CORES: ${{ inputs.cores }}
          TRY_FILTER: ${{ inputs.filter }}
          TRY_AGAINST: ${{ inputs.against }}
        run: |
          # A line cargo writes to its standard error is not an error here.
          $ErrorActionPreference = 'Continue'
          cargo run --locked --quiet --package xtask -- try `
            --command "$env:TRY_COMMAND" --profile "$env:TRY_PROFILE" `
            --count "$env:TRY_COUNT" --load "$env:TRY_LOAD" --cores "$env:TRY_CORES" `
            --filter "$env:TRY_FILTER" --against "$env:TRY_AGAINST" `
            2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "$env:RUNNER_TEMP\try-output.log"
          exit $LASTEXITCODE
      - name: Put the end of the output in the summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/try-output.log" ]; then
            {
              echo "### The last 80 lines of the output"
              echo
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/try-output.log" | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the reports and the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: try-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/try-output.log
            target/nextest/ci/junit.xml
            target/nextest/stress/junit.xml
            target/ab/*.xml
          if-no-files-found: ignore
          retention-days: 14
